# Project-wide Gradle settings optimized for 4GB low-RAM environment
org.gradle.jvmargs=-Xmx512m -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx256m -XX:+UseSerialGC
android.useAndroidX=true
