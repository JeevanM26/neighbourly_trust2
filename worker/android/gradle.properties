# Project-wide Gradle settings with C1 compiler for low-RAM Windows
org.gradle.jvmargs=-Xmx512m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx384m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
android.useAndroidX=true
