name: Supabase Database Backup

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz
          sudo mv supabase /usr/local/bin/

      - name: Run Supabase Database Backup Dump
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          supabase db dump --project-ref "$SUPABASE_PROJECT_ID" -f "backups/db_backup_${TIMESTAMP}.sql"

      - name: Store Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup
          path: backups/
          retention-days: 30
