<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Ambient & Drop Shadow -->
    <filter id="acShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <!-- 3D Body Gradient -->
    <linearGradient id="acBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Metallic Trim -->
    <linearGradient id="acTrimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Cool Air Breeze Gradient -->
    <linearGradient id="airGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Frost Crystal Grad -->
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- 3D Main AC Unit -->
  <g filter="url(#acShadow)" transform="translate(0, 10)">
    <!-- Back Depth Chamfer -->
    <rect x="25" y="45" width="150" height="75" rx="16" fill="#94A3B8"/>
    
    <!-- Front AC Unit Panel -->
    <rect x="25" y="40" width="150" height="75" rx="16" fill="url(#acBodyGrad)"/>
    
    <!-- Top Highlight Bevel -->
    <path d="M 35 42 L 165 42 Q 173 42 173 48 L 173 52 Q 173 46 165 46 L 35 46 Q 27 46 27 52 L 27 48 Q 27 42 35 42 Z" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Metallic Accent Trim Line -->
    <rect x="35" y="86" width="130" height="3.5" rx="1.75" fill="url(#acTrimGrad)"/>
    
    <!-- Bottom Air Vent Louver -->
    <rect x="35" y="94" width="130" height="14" rx="7" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Louver Slat -->
    <line x1="45" y1="101" x2="155" y2="101" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- LED Display Glow -->
    <rect x="135" y="56" width="28" height="18" rx="6" fill="#0F172A"/>
    <text x="149" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="-0.5">18°</text>
    
    <!-- Brand Logo Dot -->
    <circle cx="45" cy="65" r="4" fill="#0284C7" opacity="0.8"/>
  </g>

  <!-- Cool Wind Streams & Snow Crystals -->
  <path d="M 50 135 Q 70 155 100 150 T 150 165" fill="none" stroke="url(#airGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 65 148 Q 85 168 115 162 T 165 178" fill="none" stroke="url(#airGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 3D Ice Snowflake 1 -->
  <g transform="translate(42, 142) scale(0.65)" filter="url(#acShadow)">
    <circle cx="20" cy="20" r="16" fill="url(#frostGrad)"/>
    <!-- Snowflake Spokes -->
    <line x1="20" y1="8" x2="20" y2="32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="20" x2="32" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="11" y1="11" x2="29" y2="29" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="29" y1="11" x2="11" y2="29" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 3D Ice Snowflake 2 -->
  <g transform="translate(140, 138) scale(0.5)" filter="url(#acShadow)">
    <circle cx="20" cy="20" r="16" fill="url(#frostGrad)"/>
    <line x1="20" y1="8" x2="20" y2="32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="20" x2="32" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="11" y1="11" x2="29" y2="29" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="29" y1="11" x2="11" y2="29" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
